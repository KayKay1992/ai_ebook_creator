<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Real Kenlibs icon set (Step 48) — an open book with a navy spine on
         the terracotta gradient background, matching the app's palette.
         Sized favicon PNGs are standard practice alongside the .ico for
         broad browser support (Safari/Firefox prefer a sized PNG over
         picking a frame out of the .ico themselves). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09262e" />
    <!-- Theme before first paint (no white flash in dark mode): same rules
         as src/utils/theme.js (kept in sync by utils/theme.test.js). Dark
         only on reader-facing routes; admin always light. -->
    <script>
      (function () {
        try {
          var reader = !/^\/(?:login|signup|forgot-password|reset-password|dashboard|profile|editor|view-book|admin)(?:\/|$)/.test(location.pathname);
          var pref = localStorage.getItem("kenlibs_theme");
          var dark = reader && (pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches));
          var root = document.documentElement;
          if (reader) root.setAttribute("data-theme", dark ? "dark" : "light");
          root.style.colorScheme = dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", !reader ? "#ffffff" : dark ? "#061a1f" : "#09262e");
        } catch (e) {}
      })();
    </script>
    <!-- The only preloaded font: the storefront hero headline (the page's
         largest text, so it shouldn't swap late). Every other face in
         src/fonts.css loads on demand with font-display: swap. -->
    <link
      rel="preload"
      href="./node_modules/@fontsource-variable/fraunces/files/fraunces-latin-soft-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Shared default tab title for the whole app (single HTML shell, no
         per-route title otherwise). Kenlibs pages override this dynamically
         via useDocumentTitle (see src/hooks) for a more specific title while
         mounted; every other page, admin included, falls back to this. -->
    <title>Kenlibs</title>
    <meta name="description" content="Kenlibs — browse, buy, and read a curated library of books." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kenlibs" />
    <meta property="og:description" content="Kenlibs — browse, buy, and read a curated library of books." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
